<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bootstrap Carousel Cards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #0e0e0e;
        color: #fff;
      }

      .border-glow {
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 15px;
      }

      .carousel-box {
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 600;
      }

      .youtube-card {
        background: #111;
        height: 10px;
        padding: 25px;
        text-align: center;
        height: 100%;
      }

      .youtube-card h3 {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .youtube-card p {
        opacity: 0.7;
        margin-bottom: 20px;
      }

      .btn-watch {
        background-color: #2f4f7f;
        color: #fff;
        font-weight: 600;
      }

      .btn-watch:hover {
        background-color: #3d66a6;
        color: #fff;
      }

      footer {
        margin-top: 40px;
        padding: 15px;
        text-align: center;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <!-- Carousel Section -->
      <div class="border-glow carousel-box mb-4">Carousel</div>

      <!-- Cards Section -->
      <div class="row g-4">
        <div class="col-md-4">
          <div class="border-glow youtube-card">
            <h3>youtube</h3>
            <p>card</p>
            <button class="btn btn-watch w-100">watch now</button>
          </div>
        </div>

        <div class="col-md-4">
          <div class="border-glow youtube-card">
            <h3>youtube</h3>
            <p>card</p>
            <button class="btn btn-watch w-100">watch now</button>
          </div>
        </div>

        <div class="col-md-4">
          <div class="border-glow youtube-card">
            <h3>youtube</h3>
            <p>card</p>
            <button class="btn btn-watch w-100">watch now</button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="border-glow mt-4">&copy; - Arunkumar</footer>
    </div>
  </body>
</html>
