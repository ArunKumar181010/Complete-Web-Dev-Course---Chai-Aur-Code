<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox practice</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(135deg, red, yellow);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .all {
        background-color: #ffffff;
        border: 2px solid black;
        padding: 10px;
        border-radius: 9px;
        height: 200px;
      }
      .elements {
        display: flex;
        height: 60px;
        justify-content: center;
      }
      .square-1 {
        width: 50px;
        height: 50px;
        background-color: #ff7e7e;
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 5px;
        font: bold 15px Arial;
      }
      .square-2 {
        width: 50px;
        height: 50px;
        background-color: #7eff7e;
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 5px;
        font: bold 15px Arial;
      }
      .square-3 {
        width: 50px;
        height: 50px;
        background-color: #7e7eff;
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 5px;
        font: bold 15px Arial;
      }
    </style>
  </head>
  <body>
    <div class="all">
      <h1 style="color: rgb(0, 0, 0)">1) Flexbox practice</h1>

      <div class="elements">
        <div class="square-1" style="flex-wrap: wrap; height: auto">1</div>
        <div class="square-2" style="flex-wrap: wrap; height: auto">2</div>
        <div class="square-3" style="flex-wrap: wrap; height: auto">3</div>
      </div>
    </div>
  </body>
</html>
